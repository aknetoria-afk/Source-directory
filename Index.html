<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    h2 { font-size: 18px; margin-bottom: 4px; }
    p.hint { color: #666; font-size: 13px; margin-top: 0; }
    label { display: block; margin-top: 14px; font-size: 13px; font-weight: bold; color: #333; }
    select, input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 14px; }
    small { color: #888; }
    button { margin-top: 20px; padding: 10px 16px; font-size: 14px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1558b0; }
    button:disabled { background: #aaa; cursor: default; }
    #result { margin-top: 20px; padding: 12px; background: #eafaf0; border: 1px solid #34a853; border-radius: 4px; word-break: break-all; font-size: 13px; display: none; }
    #copyBtn { margin-top: 8px; background: #34a853; }
    #err { color: #c00; font-size: 13px; margin-top: 10px; padding: 10px; background: #fdecea; border-radius: 4px; display: none; }
    #loading { font-size: 13px; color: #666; display: none; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Новая запись — Справочник источников</h2>
  <p class="hint">Строка добавится в конец вкладки "Справочник источников", Sources и Phones обновятся автоматически.</p>

  <label>1. Тип обращения</label>
  <select id="tip"></select>

  <label>2. Раздел</label>
  <select id="razdel"></select>

  <label>3. Источник обращения <small>(зависит от Раздела)</small></label>
  <select id="istochnik"></select>

  <label>4. Площадка размещения <small>(зависит от Источника)</small></label>
  <select id="analitika"></select>

  <label>5. Проект</label>
  <select id="proekt"></select>

  <label>6. URL <small>(только домены sever-group.ru, double-double.ru, literaturny.ru, xn--80ajrlru9c.xn--p1ai, dius-mfk.ru)</small></label>
  <input id="urlBase" type="text" placeholder="https://sever-group.ru/...">

  <label>7. Ответственный за площадку (РА)</label>
  <select id="ra"></select>

  <label>8. Кампания <small>(одно слово латиницей, без пробелов)</small></label>
  <input id="campaignWord" type="text" placeholder="catalog">

  <button id="submitBtn" onclick="submitForm()">Создать запись</button>
  <div id="loading">Обрабатываю...</div>
  <div id="err"></div>
  <div id="result">
    <div><b>utm_term:</b> <span id="rTerm"></span></div>
    <div><b>utm_campaign:</b> <span id="rCampaign"></span></div>
    <div style="margin-top:8px;"><b>URL с UTM:</b></div>
    <div id="rUrl"></div>
    <button id="copyBtn" onclick="copyResult()">Скопировать ссылку</button>
  </div>

  <script>
    var GEN_DATA = null;

    google.script.run.withSuccessHandler(function (data) {
      GEN_DATA = data;
      fillSimpleSelect('tip', data.tip);
      fillSimpleSelect('razdel', data.razdel);
      fillSimpleSelect('proekt', data.proekt.map(function (x) { return x.label; }));
      fillSimpleSelect('ra', data.ra.map(function (x) { return x.label; }));

      refreshIstochnik();
      refreshAnalitika();
      document.getElementById('razdel').addEventListener('change', function () {
        refreshIstochnik();
        refreshAnalitika();
      });
      document.getElementById('istochnik').addEventListener('change', refreshAnalitika);
    }).withFailureHandler(showError).getGeneratorData();

    function fillSimpleSelect(id, values) {
      var sel = document.getElementById(id);
      sel.innerHTML = '';
      values.forEach(function (v) {
        var opt = document.createElement('option');
        opt.value = v;
        opt.text = v;
        sel.appendChild(opt);
      });
    }

    function numPrefix1(str) {
      // ведущее число до первой точки, например "01" из "01. Интернет" или "01.02. Базы недвижимости"
      var m = String(str).match(/^\d+/);
      return m ? m[0] : '';
    }

    function numPrefix2(str) {
      // ведущее "NN.NN", например "01.02" из "01.02. Базы недвижимости" или "01.02 Авито"
      var m = String(str).match(/^\d+\.\d+/);
      return m ? m[0] : '';
    }

    function refreshIstochnik() {
      var razdel = document.getElementById('razdel').value;
      var prefix = numPrefix1(razdel);
      var filtered = GEN_DATA.istochnik.filter(function (v) {
        return numPrefix1(v) === prefix;
      });
      fillSimpleSelect('istochnik', filtered);
    }

    function refreshAnalitika() {
      var istochnik = document.getElementById('istochnik').value;
      var prefix = numPrefix2(istochnik);
      var filtered = GEN_DATA.analitika.filter(function (a) {
        return numPrefix2(a.label) === prefix;
      });
      var sel = document.getElementById('analitika');
      sel.innerHTML = '';
      filtered.forEach(function (a) {
        var opt = document.createElement('option');
        opt.value = a.label;
        opt.text = a.label;
        sel.appendChild(opt);
      });
    }

    function showError(err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('submitBtn').disabled = false;
      var box = document.getElementById('err');
      box.style.display = 'block';
      box.innerText = err.message || err;
    }

    function submitForm() {
      document.getElementById('err').style.display = 'none';
      document.getElementById('result').style.display = 'none';

      var campaignWord = document.getElementById('campaignWord').value.replace(/\s+$/, '');
      document.getElementById('campaignWord').value = campaignWord;

      var payload = {
        tip: document.getElementById('tip').value,
        razdel: document.getElementById('razdel').value,
        istochnik: document.getElementById('istochnik').value,
        analitika: document.getElementById('analitika').value,
        proekt: document.getElementById('proekt').value,
        ra: document.getElementById('ra').value,
        campaignWord: campaignWord,
        urlBase: document.getElementById('urlBase').value.trim(),
      };

      if (!payload.urlBase) { showError('Укажите URL'); return; }
      if (!payload.campaignWord) { showError('Укажите название кампании'); return; }

      document.getElementById('submitBtn').disabled = true;
      document.getElementById('loading').style.display = 'block';

      google.script.run.withSuccessHandler(function (res) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('submitBtn').disabled = false;

        if (res.status === 'domain_not_allowed') {
          showError(res.message);
          return;
        }
        if (res.status === 'error') {
          showError(res.message);
          return;
        }

        document.getElementById('rTerm').innerText = res.utmTerm;
        document.getElementById('rCampaign').innerText = res.utmCampaign;
        document.getElementById('rUrl').innerText = res.urlWithUtm;
        document.getElementById('result').style.display = 'block';

        if (res.reserveNotice && res.reserveNotice.notified) {
          alert('Внимание: свободных резервных utm_term осталось ' + res.reserveNotice.free +
                ' — отправлено уведомление.');
        }
      }).withFailureHandler(showError).processSubmission(payload);
    }

    function copyResult() {
      var text = document.getElementById('rUrl').innerText;
      navigator.clipboard.writeText(text).then(function () {
        var btn = document.getElementById('copyBtn');
        var old = btn.innerText;
        btn.innerText = 'Скопировано!';
        setTimeout(function () { btn.innerText = old; }, 1500);
      });
    }
  </script>
</body>
</html>
